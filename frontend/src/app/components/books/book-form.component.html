<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <div class="card">
        <div class="card-header">
          <h3>{{ isEditMode ? 'Edit Book' : 'Add New Book' }}</h3>
        </div>
        <div class="card-body">
          @if (loading && isEditMode) {
            <div class="text-center">
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          } @else {
            <form (ngSubmit)="onSubmit()" #bookForm="ngForm">
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  name="title"
                  [(ngModel)]="book.title"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="author" class="form-label">Author</label>
                <input
                  type="text"
                  class="form-control"
                  id="author"
                  name="author"
                  [(ngModel)]="book.author"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="isbn" class="form-label">ISBN</label>
                <input
                  type="text"
                  class="form-control"
                  id="isbn"
                  name="isbn"
                  [(ngModel)]="book.isbn"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="publisher" class="form-label">Publisher</label>
                <input
                  type="text"
                  class="form-control"
                  id="publisher"
                  name="publisher"
                  [(ngModel)]="book.publisher"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="publishedDate" class="form-label">Published Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="publishedDate"
                  name="publishedDate"
                  [(ngModel)]="book.publishedDate"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <input
                  type="text"
                  class="form-control"
                  id="category"
                  name="category"
                  [(ngModel)]="book.category"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  class="form-control"
                  id="description"
                  name="description"
                  rows="4"
                  [(ngModel)]="book.description"
                  required
                ></textarea>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="totalCopies" class="form-label">Total Copies</label>
                  <input
                    type="number"
                    class="form-control"
                    id="totalCopies"
                    name="totalCopies"
                    [(ngModel)]="book.totalCopies"
                    required
                    min="0"
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label for="availableCopies" class="form-label">Available Copies</label>
                  <input
                    type="number"
                    class="form-control"
                    id="availableCopies"
                    name="availableCopies"
                    [(ngModel)]="book.availableCopies"
                    required
                    min="0"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="coverImageUrl" class="form-label">Cover Image URL</label>
                <input
                  type="text"
                  class="form-control"
                  id="coverImageUrl"
                  name="coverImageUrl"
                  [(ngModel)]="book.coverImageUrl"
                />
              </div>

              @if (errorMessage) {
                <div class="alert alert-danger">{{ errorMessage }}</div>
              }

              <div class="d-flex justify-content-between">
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="loading || !bookForm.valid"
                >
                  @if (loading) {
                    <span class="spinner-border spinner-border-sm me-2"></span>
                  }
                  {{ isEditMode ? 'Update' : 'Create' }} Book
                </button>
                <a routerLink="/books" class="btn btn-secondary">Cancel</a>
              </div>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
