# Application Configuration
spring.application.name=bookbiblio

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
# NOTE: For production, use environment variables for sensitive data
spring.datasource.url=jdbc:mysql://localhost:3306/bookbiblio?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# SECURITY WARNING: In production, store JWT secret in environment variables or secure configuration
# Use a strong, randomly generated secret key (this is a sample key for development only)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:4200

# Logging Configuration
logging.level.com.bookbiblio=DEBUG
logging.level.org.springframework.security=DEBUG
